<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12;
    --surface:#131822;
    --surface-alt:#1B2230;
    --border:#232B3A;
    --accent:#24A6FF;
    --accent-dim:#0098EA;
    --danger:#FF6A3D;
    --ok:#4ADE80;
    --text:#E7ECF3;
    --muted:#7C8AA0;
    --led-off:#3A4152;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(36,166,255,0.07), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    display:flex;
    justify-content:center;
    padding:48px 20px 80px;
  }
  .console{
    width:100%;
    max-width:560px;
  }
  .titlebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .titlebar h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.2px;
    margin:0;
  }
  .titlebar h1 span{color:var(--accent);}
  .net-toggle{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
  }
  .net-toggle button{
    background:none;
    border:none;
    color:var(--muted);
    padding:7px 12px;
    cursor:pointer;
  }
  .net-toggle button.active{
    background:var(--surface-alt);
    color:var(--text);
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    margin-bottom:16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  }

  .status-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .led{
    width:9px;height:9px;border-radius:50%;
    background:var(--led-off);
    box-shadow:0 0 0 3px rgba(255,255,255,0.02);
    flex-shrink:0;
  }
  .led.connected{background:var(--ok); box-shadow:0 0 8px var(--ok);}
  .led.wrong-owner{background:var(--danger); box-shadow:0 0 8px var(--danger);}
  .status-text{font-size:13px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .status-text b{color:var(--text); font-weight:500;}

  #connect-btn{
    margin-left:auto;
    background:var(--accent-dim);
    color:#04121D;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  #connect-btn:hover{background:var(--accent);}

  .readout{
    font-family:'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size:34px;
    font-weight:600;
    letter-spacing:-0.5px;
    margin:2px 0 4px;
  }
  .readout small{font-size:15px; color:var(--muted); font-weight:400; margin-left:6px;}
  .readout-label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted);}

  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    font-family:'JetBrains Mono', monospace;
  }
  .field input{
    width:100%;
    background:var(--surface-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }
  .field input:focus{outline:none; border-color:var(--accent-dim);}

  .section-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .section-head .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--muted);
    border:1px solid var(--border);
    padding:2px 6px;
    border-radius:5px;
  }

  .action-btn{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-top:4px;
  }
  .action-btn.deposit{background:var(--accent-dim); color:#04121D;}
  .action-btn.deposit:hover{background:var(--accent);}
  .action-btn.withdraw{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  .action-btn.withdraw:hover{background:rgba(255,106,61,0.08);}
  .action-btn:disabled{opacity:0.4; cursor:not-allowed;}

  details.config{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
  }
  details.config summary{cursor:pointer; padding:4px 0;}
  details.config .field{margin-top:12px;}

  .log{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    max-height:120px;
    overflow-y:auto;
    border-top:1px solid var(--border);
    margin-top:16px;
    padding-top:10px;
    line-height:1.6;
  }
  .log .ok{color:var(--ok);}
  .log .err{color:var(--danger);}
</style>
</head>
<body>

<div class="console">
  <div class="titlebar">
    <h1>Vault <span>Console</span></h1>
    <div class="net-toggle">
      <button id="net-testnet" class="active">testnet</button>
      <button id="net-mainnet">mainnet</button>
    </div>
  </div>

  <!-- Статус подключения -->
  <div class="panel">
    <div class="status-row">
      <div class="led" id="led"></div>
      <div class="status-text" id="status-text">Кошелёк не подключен</div>
      <button id="connect-btn">Connect wallet</button>
    </div>

    <div class="readout-label">Баланс vault</div>
    <div class="readout" id="balance-readout">— <small>GRAM</small></div>

    <details class="config">
      <summary>Настройки контракта (заполнить один раз)</summary>
      <div class="field">
        <label>Адрес Vault</label>
        <input id="cfg-vault" placeholder="EQ...">
      </div>
      <div class="field">
        <label>Opcode Withdraw (hex, из Vault.abi)</label>
        <input id="cfg-op-withdraw" placeholder="0x...">
      </div>
      <div class="field">
        <label>Opcode SendNft (hex, из Vault.abi)</label>
        <input id="cfg-op-sendnft" placeholder="0x...">
      </div>
    </details>
  </div>

  <!-- Депозит -->
  <div class="panel">
    <div class="section-head">Депозит <span class="tag">любой отправитель</span></div>
    <div class="field">
      <label>Сумма, GRAM</label>
      <input id="dep-amount" placeholder="1.0" inputmode="decimal">
    </div>
    <button class="action-btn deposit" id="btn-deposit">Отправить в vault</button>
  </div>

  <!-- Вывод TON -->
  <div class="panel">
    <div class="section-head">Вывод GRAM <span class="tag">только owner</span></div>
    <div class="field">
      <label>Получатель</label>
      <input id="wd-to" placeholder="EQ...">
    </div>
    <div class="field">
      <label>Сумма, GRAM</label>
      <input id="wd-amount" placeholder="0.5" inputmode="decimal">
    </div>
    <button class="action-btn withdraw" id="btn-withdraw">Вывести</button>
  </div>

  <!-- Отправка NFT -->
  <div class="panel">
    <div class="section-head">Отправка NFT <span class="tag">только owner</span></div>
    <div class="field">
      <label>Адрес NFT-айтема</label>
      <input id="nft-addr" placeholder="EQ...">
    </div>
    <div class="field">
      <label>Новый владелец</label>
      <input id="nft-owner" placeholder="EQ...">
    </div>
    <div class="field">
      <label>Газ на пересылку, GRAM</label>
      <input id="nft-gas" placeholder="0.08" inputmode="decimal">
    </div>
    <button class="action-btn withdraw" id="btn-sendnft">Отправить NFT</button>
  </div>

  <div class="log" id="log">
    <div>console ready — заполните адрес Vault и подключите кошелёк</div>
  </div>
</div>

<script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const log = (msg, cls) => {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  $('log').prepend(line);
};

// ── состояние ────────────────────────────────────────────
let network = 'testnet';
let connectedAddress = null;

// сохраняем конфиг в localStorage — это статическая страница, не iframe-artefact
const cfgKeys = ['cfg-vault', 'cfg-op-withdraw', 'cfg-op-sendnft'];
cfgKeys.forEach(k => { const v = localStorage.getItem(k); if (v) $(k).value = v; });
cfgKeys.forEach(k => $(k).addEventListener('change', () => localStorage.setItem(k, $(k).value)));

$('net-testnet').onclick = () => setNetwork('testnet');
$('net-mainnet').onclick = () => setNetwork('mainnet');
function setNetwork(n){
  network = n;
  $('net-testnet').classList.toggle('active', n==='testnet');
  $('net-mainnet').classList.toggle('active', n==='mainnet');
  log(`сеть переключена: ${n}`);
}

// ── TonConnect ───────────────────────────────────────────
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: location.origin + location.pathname.replace('index.html','') + 'tonconnect-manifest.json',
  buttonRootId: null
});

tonConnectUI.onStatusChange(wallet => {
  if (wallet) {
    connectedAddress = wallet.account.address;
    const friendly = new TonWeb.utils.Address(connectedAddress).toString(true, true, true);
    $('led').className = 'led connected';
    $('status-text').innerHTML = `Подключен: <b>${friendly.slice(0,6)}…${friendly.slice(-4)}</b>`;
    $('connect-btn').textContent = 'Disconnect';
    log(`кошелёк подключен: ${friendly}`, 'ok');
  } else {
    connectedAddress = null;
    $('led').className = 'led';
    $('status-text').textContent = 'Кошелёк не подключен';
    $('connect-btn').textContent = 'Connect wallet';
  }
});

$('connect-btn').onclick = () => {
  if (connectedAddress) tonConnectUI.disconnect();
  else tonConnectUI.openModal();
};

// ── хелперы кодирования (TonWeb) ────────────────────────
function toNano(x){ return TonWeb.utils.toNano(String(x || '0')); }

function cellToBase64(cell){
  return TonWeb.utils.bytesToBase64(cell.toBoc(false));
}

function buildDepositBody(){
  const cell = new TonWeb.boc.Cell();
  cell.bits.writeUint(0, 32);           // opcode 0 = обычный комментарий
  const bytes = new TextEncoder().encode('deposit');
  for (const b of bytes) cell.bits.writeUint8(b);
  return cellToBase64(cell);
}

function buildWithdrawBody(opcodeHex, amountNano, toAddr){
  const cell = new TonWeb.boc.Cell();
  cell.bits.writeUint(parseInt(opcodeHex, 16), 32);
  cell.bits.writeCoins(amountNano);
  cell.bits.writeAddress(new TonWeb.utils.Address(toAddr));
  return cellToBase64(cell);
}

function buildSendNftBody(opcodeHex, nftAddr, newOwner, forwardNano){
  const cell = new TonWeb.boc.Cell();
  cell.bits.writeUint(parseInt(opcodeHex, 16), 32);
  cell.bits.writeAddress(new TonWeb.utils.Address(nftAddr));
  cell.bits.writeAddress(new TonWeb.utils.Address(newOwner));
  cell.bits.writeCoins(forwardNano);
  return cellToBase64(cell);
}

async function sendTx(toAddress, valueNano, bodyBase64, label){
  if (!connectedAddress) { log('сначала подключите кошелёк', 'err'); return; }
  try {
    const tx = {
      validUntil: Math.floor(Date.now()/1000) + 300,
      messages: [{
        address: toAddress,
        amount: valueNano.toString(),
        payload: bodyBase64
      }]
    };
    log(`${label}: запрос подписи в кошельке...`);
    await tonConnectUI.sendTransaction(tx);
    log(`${label}: транзакция отправлена ✓`, 'ok');
  } catch (e) {
    log(`${label}: ошибка — ${e.message || e}`, 'err');
  }
}

// ── кнопки действий ──────────────────────────────────────
$('btn-deposit').onclick = () => {
  const vault = $('cfg-vault').value.trim();
  if (!vault) return log('укажите адрес Vault в настройках', 'err');
  const amount = toNano($('dep-amount').value);
  sendTx(vault, amount, buildDepositBody(), 'Депозит');
};

$('btn-withdraw').onclick = () => {
  const vault = $('cfg-vault').value.trim();
  const op = $('cfg-op-withdraw').value.trim();
  const to = $('wd-to').value.trim();
  if (!vault || !op) return log('заполните адрес Vault и opcode Withdraw в настройках', 'err');
  if (!to) return log('укажите получателя', 'err');
  const amount = toNano($('wd-amount').value);
  const body = buildWithdrawBody(op, amount, to);
  sendTx(vault, toNano('0.05'), body, 'Вывод GRAM'); // 0.05 — газ на выполнение, сама сумма внутри body
};

$('btn-sendnft').onclick = () => {
  const vault = $('cfg-vault').value.trim();
  const op = $('cfg-op-sendnft').value.trim();
  const nft = $('nft-addr').value.trim();
  const newOwner = $('nft-owner').value.trim();
  if (!vault || !op) return log('заполните адрес Vault и opcode SendNft в настройках', 'err');
  if (!nft || !newOwner) return log('укажите адрес NFT и нового владельца', 'err');
  const gas = toNano($('nft-gas').value || '0.08');
  const body = buildSendNftBody(op, nft, newOwner, gas);
  sendTx(vault, gas, body, 'Отправка NFT');
};
</script>
</body>
</html>
